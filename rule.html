<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>蛋仔共号 · 规则查看</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f9f5ff;
      background-image: radial-gradient(circle at 10% 20%, rgba(255, 210, 255, 0.5) 0%, transparent 30%),
                        radial-gradient(circle at 90% 70%, rgba(200, 240, 255, 0.6) 0%, transparent 40%),
                        radial-gradient(circle at 30% 80%, rgba(255, 235, 190, 0.5) 0%, transparent 35%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 720px;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 52px;
      padding: 28px 22px;
      box-shadow: 0 4px 8px rgba(180, 150, 200, 0.08),
                  0 16px 40px rgba(140, 110, 170, 0.12),
                  0 30px 60px rgba(110, 80, 140, 0.08),
                  inset 0 1px 2px rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.7);
      transition: all 0.3s;
    }

    .page {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .hidden {
      display: none !important;
    }

    .home-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .home-header h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #8b6fcb, #b48ad6, #6d9ee8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 2px 10px rgba(160, 120, 210, 0.2);
      margin-bottom: 8px;
    }

    .home-header p {
      color: #8a7a9a;
      font-size: 1rem;
      letter-spacing: 1px;
    }

    .account-buttons {
      display: flex;
      flex-direction: column;
      gap: 26px;
      margin-top: 16px;
      padding: 6px;
    }

    .acc-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 28px;
      border-radius: 68px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 2px 6px rgba(170, 140, 200, 0.15),
                  0 12px 28px -8px rgba(150, 120, 180, 0.25),
                  0 24px 48px -12px rgba(120, 90, 150, 0.15),
                  inset 0 1px 4px rgba(255, 255, 255, 0.9),
                  inset 0 -2px 4px rgba(200, 180, 220, 0.2);
      cursor: pointer;
      transition: all 0.25s ease;
      color: #4e3d5e;
      font-size: 1.6rem;
      font-weight: 550;
      letter-spacing: 1px;
    }

    .acc-btn::before {
      content: '';
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      bottom: 8px;
      border-radius: 58px;
      border: 2px solid rgba(255, 255, 255, 0.6);
      pointer-events: none;
      opacity: 0.8;
      box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.5);
    }

    .acc-btn .acc-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      position: relative;
      z-index: 2;
      gap: 12px;
    }

    .acc-btn .acc-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .acc-btn .acc-name {
      font-weight: 550;
    }

    .violation-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 240, 240, 0.7);
      border-radius: 40px;
      padding: 4px 14px 4px 12px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #a55d7a;
      border: 1px solid rgba(255, 210, 210, 0.9);
      backdrop-filter: blur(4px);
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .violation-badge .price-tag {
      margin-left: 4px;
      background: rgba(255, 220, 220, 0.9);
      color: #b14e6e;
      font-weight: 700;
      border-radius: 30px;
      padding: 2px 10px;
      font-size: 0.85rem;
      border: 1px solid rgba(255, 200, 200, 0.9);
    }

    .acc-btn .acc-icon {
      font-size: 1.8rem;
      opacity: 0.8;
      filter: drop-shadow(0 2px 4px rgba(180, 150, 210, 0.3));
      flex-shrink: 0;
    }

    .acc-btn:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 6px 12px rgba(170, 140, 200, 0.2),
                  0 20px 36px -8px rgba(150, 120, 180, 0.35),
                  0 32px 56px -12px rgba(120, 90, 150, 0.2),
                  inset 0 1px 6px rgba(255, 255, 255, 1);
      border-color: rgba(210, 180, 240, 0.9);
    }

    .acc-btn:active {
      transform: translateY(0px) scale(0.99);
      box-shadow: 0 2px 6px rgba(170, 140, 200, 0.15),
                  0 8px 18px -6px rgba(150, 120, 180, 0.2),
                  inset 0 1px 4px rgba(255, 255, 255, 0.8);
    }

    .acc-btn[data-theme="1"] {
      background: linear-gradient(145deg, rgba(255, 240, 250, 0.8), rgba(245, 230, 255, 0.75));
      border-color: rgba(220, 190, 255, 0.9);
    }

    .acc-btn[data-theme="2"] {
      background: linear-gradient(145deg, rgba(235, 245, 255, 0.85), rgba(230, 240, 255, 0.75));
      border-color: rgba(180, 210, 255, 0.9);
    }

    .rule-page {
      animation: fadeIn 0.5s ease;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.5);
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      border-radius: 48px;
      padding: 8px 18px;
      margin-bottom: 14px;
      font-size: 0.95rem;
      color: #5e4b6e;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 2px 10px rgba(160, 130, 190, 0.1), inset 0 1px 4px rgba(255, 255, 255, 0.6);
      cursor: pointer;
      transition: 0.2s;
      width: fit-content;
      font-weight: 500;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 14px rgba(160, 130, 190, 0.2);
      transform: translateX(-2px);
    }

    .clock-area {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 44px;
      padding: 16px 18px;
      margin-bottom: 24px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 6px 18px rgba(170, 140, 200, 0.1),
                  inset 0 2px 6px rgba(255, 255, 255, 0.8);
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Courier New', monospace;
      min-height: 96px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .skeleton {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 44px;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .skeleton-line {
      position: relative;
      background: linear-gradient(90deg,
        rgba(220, 205, 240, 0.35) 0%,
        rgba(220, 205, 240, 0.35) 35%,
        rgba(255, 255, 255, 0.85) 50%,
        rgba(220, 205, 240, 0.35) 65%,
        rgba(220, 205, 240, 0.35) 100%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite linear;
      border-radius: 12px;
    }

    .skeleton-line.date-line {
      width: 60%;
      height: 22px;
    }

    .skeleton-line.time-line {
      width: 45%;
      height: 30px;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .clock-display {
      display: flex;
      flex-direction: column;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .clock-display.visible {
      opacity: 1;
    }

    .clock-date {
      font-size: 1.5rem;
      font-weight: 450;
      color: #56456b;
      letter-spacing: 1.5px;
      line-height: 1.3;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
    }

    .clock-time {
      font-size: 2rem;
      font-weight: 480;
      color: #4d3a64;
      letter-spacing: 3px;
      line-height: 1.2;
      text-shadow: 0 2px 6px rgba(190, 160, 220, 0.2);
    }

    .clock-error {
      font-size: 1.35rem;
      font-weight: 500;
      color: #b14e6e;
      letter-spacing: 2px;
      text-shadow: 0 1px 4px rgba(255, 255, 255, 0.8);
      padding: 8px 0;
      display: none;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .clock-error.visible {
      display: block;
      opacity: 1;
    }

    .rule-title {
      font-size: 2.2rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      background: linear-gradient(145deg, #7d62b0, #b18bd9, #6f91d6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-align: center;
      margin-bottom: 18px;
      text-shadow: 0 4px 16px rgba(140, 110, 190, 0.25);
      padding-bottom: 4px;
      border-bottom: 2px dashed rgba(190, 165, 220, 0.4);
    }

    .rules-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .rule-block {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 32px;
      padding: 18px 20px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 12px rgba(170, 140, 200, 0.08),
                  0 12px 28px -8px rgba(150, 120, 180, 0.15),
                  inset 0 1px 6px rgba(255, 255, 255, 0.8);
      transition: all 0.2s;
      transform-origin: top center;
      animation: slideUpFade 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    .rule-block:nth-child(1) { animation-delay: 0.02s; }
    .rule-block:nth-child(2) { animation-delay: 0.08s; }
    .rule-block:nth-child(3) { animation-delay: 0.14s; }
    .rule-block:nth-child(4) { animation-delay: 0.20s; }
    .rule-block:nth-child(5) { animation-delay: 0.26s; }
    .rule-block:nth-child(6) { animation-delay: 0.32s; }
    .rule-block:nth-child(7) { animation-delay: 0.38s; }
    .rule-block:nth-child(8) { animation-delay: 0.44s; }
    .rule-block:nth-child(9) { animation-delay: 0.50s; }
    .rule-block:nth-child(10) { animation-delay: 0.56s; }
    .rule-block:nth-child(11) { animation-delay: 0.62s; }
    .rule-block:nth-child(12) { animation-delay: 0.68s; }

    @keyframes slideUpFade {
      0% {
        opacity: 0;
        transform: translateY(16px) scale(0.96);
        filter: blur(2px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    .rule-block h3 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #5c4580;
      margin-bottom: 10px;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .rule-block h3 .emoji-bullet {
      font-size: 1.3rem;
      filter: drop-shadow(0 2px 4px rgba(170, 140, 210, 0.3));
    }

    .rule-block ul, .rule-block p {
      color: #3f3152;
      font-size: 0.98rem;
      line-height: 1.6;
      margin-bottom: 6px;
      padding-left: 4px;
    }

    .rule-block li {
      margin-bottom: 6px;
      list-style: none;
      position: relative;
      padding-left: 22px;
    }

    .rule-block li::before {
      content: "·";
      position: absolute;
      left: 6px;
      color: #ab8bc0;
      font-weight: 700;
      font-size: 1.3rem;
      line-height: 1;
      top: 2px;
    }

    .price-tag {
      display: inline-block;
      background: rgba(220, 200, 240, 0.45);
      border-radius: 30px;
      padding: 2px 10px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #6a4e8a;
      margin-left: 6px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(4px);
    }

    .footnote {
      margin-top: 20px;
      padding: 14px 18px;
      border-radius: 36px;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: 0.9rem;
      color: #5e4f70;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: inset 0 1px 6px rgba(255, 255, 255, 0.7), 0 4px 12px rgba(150, 120, 180, 0.08);
      text-align: center;
      font-style: italic;
      letter-spacing: 0.3px;
    }

    /* 联系我按钮 */
    .contact-btn {
      margin-top: 30px;
      padding: 18px 24px;
      border-radius: 60px;
      border: 2px dashed rgba(190, 165, 220, 0.8);
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 14px rgba(170, 140, 200, 0.08),
                  inset 0 1px 4px rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .contact-btn:hover {
      background: rgba(255, 255, 255, 0.75);
      border-color: rgba(170, 140, 210, 1);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(170, 140, 200, 0.15),
                  inset 0 1px 6px rgba(255, 255, 255, 1);
    }

    .contact-btn:active {
      transform: translateY(0);
    }

    .contact-label {
      font-size: 1.15rem;
      font-weight: 550;
      color: #5e4b7a;
      letter-spacing: 0.5px;
    }

    /* 联系我弹窗 */
    .contact-modal {
      position: fixed;
      inset: 0;
      background: rgba(90, 70, 110, 0.28);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .contact-modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .contact-card {
      position: relative;
      width: 100%;
      max-width: 360px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 40px;
      padding: 26px 24px 22px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 20px 60px rgba(120, 90, 150, 0.25),
                  inset 0 1px 3px rgba(255, 255, 255, 0.9);
      transform: translateY(16px) scale(0.96);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .contact-modal.open .contact-card {
      transform: translateY(0) scale(1);
    }

    .contact-close {
      position: absolute;
      top: 16px;
      right: 18px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(230, 220, 240, 0.6);
      color: #7a6a8e;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .contact-close:hover {
      background: rgba(220, 200, 240, 0.9);
      color: #5e4b7a;
    }

    .contact-title {
      font-size: 1.6rem;
      font-weight: 650;
      text-align: center;
      background: linear-gradient(145deg, #7d62b0, #b18bd9, #6f91d6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.3px;
    }

    .contact-sub {
      text-align: center;
      font-size: 0.8rem;
      color: #9a8aae;
      letter-spacing: 1px;
      margin: 4px 0 18px;
    }

    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(245, 240, 255, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      padding: 12px 16px;
      box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.8);
    }

    .ci-label {
      font-size: 0.82rem;
      color: #8a7a9e;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .ci-value {
      font-size: 0.95rem;
      color: #4e3d5e;
      font-weight: 550;
      letter-spacing: 0.3px;
      word-break: break-all;
      text-align: right;
      margin-left: 12px;
    }

    /* QQ 跳转链接 */
    .contact-link {
      text-decoration: none;
      cursor: pointer;
      transition: 0.2s;
    }

    .contact-link:hover {
      background: rgba(235, 225, 255, 0.9);
      border-color: rgba(210, 180, 240, 0.9);
    }

    .ci-arrow {
      font-size: 0.75rem;
      color: #9a7ac0;
      margin-left: 4px;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 480px) {
      .app {
        padding: 18px 16px;
        border-radius: 40px;
      }
      .acc-btn {
        padding: 18px 20px;
        font-size: 1.35rem;
      }
      .acc-btn::before {
        top: 6px; left: 6px; right: 6px; bottom: 6px;
        border-radius: 50px;
      }
      .acc-btn .acc-left {
        gap: 8px;
      }
      .violation-badge {
        font-size: 0.75rem;
        padding: 3px 10px;
      }
      .violation-badge .price-tag {
        padding: 1px 8px;
        font-size: 0.75rem;
      }
      .clock-date { font-size: 1.2rem; }
      .clock-time { font-size: 1.6rem; }
      .clock-error { font-size: 1.15rem; }
      .rule-title { font-size: 1.8rem; }
      .rule-block h3 { font-size: 1.1rem; }
      .skeleton-line.date-line { width: 65%; height: 18px; }
      .skeleton-line.time-line { width: 50%; height: 26px; }
      .contact-btn { padding: 16px 20px; }
      .contact-label { font-size: 1.05rem; }
      .contact-card { padding: 22px 18px 18px; border-radius: 34px; }
      .contact-title { font-size: 1.4rem; }
      .ci-value { font-size: 0.88rem; }
    }
  </style>
</head>
<body>
<div class="app" id="app">
  <div id="homePage" class="page">
    <div class="home-header">
      <h1>✨ 共号规则 ✨</h1>
      <p>选择要查看的账号</p>
    </div>
    <div class="account-buttons">
      <div class="acc-btn" data-account="1" data-theme="1" id="btnAccount1">
        <div class="acc-content">
          <div class="acc-left">
            <span class="acc-name">软萌柠萌</span>
            <!-- ⚠️ 修改违规次数：直接改下方数字即可 🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴-->
            <span class="violation-badge">违规记录: <span class="price-tag">1</span>次</span>
          </div>
          <span class="acc-icon">🍋</span>
        </div>
      </div>
      <div class="acc-btn" data-account="2" data-theme="2" id="btnAccount2">
        <div class="acc-content">
          <div class="acc-left">
            <span class="acc-name">痛爱小嘉</span>
            <!-- ⚠️ 修改违规次数：直接改下方数字即可🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴 -->
            <span class="violation-badge">违规记录: <span class="price-tag">0</span>次</span>
          </div>
          <span class="acc-icon">💖</span>
        </div>
      </div>
    </div>

    <!-- 联系我按钮 -->
    <div class="contact-btn" id="contactBtn">
      <span class="contact-label">💬 点击此处联系我</span>
    </div>
  </div>

  <div id="rulePage1" class="page hidden rule-page">
    <div class="back-btn" data-back="home">← 返回账号选择</div>
    <div class="clock-area" id="clock1">
      <div class="skeleton" id="skeleton1">
        <div class="skeleton-line date-line"></div>
        <div class="skeleton-line time-line"></div>
      </div>
      <div class="clock-display" id="clockDisplay1">
        <div class="clock-date" id="clockDate1">--</div>
        <div class="clock-time" id="clockTime1">--:--:--</div>
      </div>
      <div class="clock-error" id="clockError1">⚠️ 网络连接超时</div>
    </div>
    <div class="rule-title">软萌柠萌</div>
    <div class="rules-container" id="rulesContainer1"></div>

<script>
  (function() {

        ]
      },
      {
        title: '三、行为规范',
        items: [
          '不恶意：提前退出、恶意挂机、骂人、找事、卡bug、刷屏。若被扣除蛋誉分或被禁言则：<span class="price-tag">¥2～¥20，视严重情况而定</span>',
          '对亲密值较高的好友，只能声明自己不是号主；对亲密值较低或自己加的好友，可称自己是号主。'
        ]
      },
      {
        title: '四、每日/每赛季任务',
        items: [
          '每日：领取呦呦彩虹币 <span class="price-tag">¥0.5</span>',
          '每周1～5：每次下线前领取活动奖励 <span class="price-tag">¥0.5</span>',
          '每周六日：疯狂星期六任务 <span class="price-tag">¥1</span>',
          '每赛季：结束前上凤凰蛋 <span class="price-tag">未达到要求则撤销共号资格</span>'
        ]
      }
    ];

    const account2Rules = [
      {
        title: '一、账号安全与登录',
        items: [
          '禁止转借/共享/出租：未经允许，不得将号转借、共享或出租 <span class="price-tag">¥10</span>',
          '上号须报备：每次上号前必须提前报备 <span class="price-tag">¥0.5</span>',
          '登录频率：每3天至少上线1次；放长假（法定节假日、寒暑假）期间2天至少上线1次游戏 <span class="price-tag">¥0 / 多次不达到则取消共号权限</span>',
          '游戏资产：贵重道具货币消耗前需征得同意，包含蛋币.许愿币.彩虹币等（未经同意的消耗按实际价值计算）'
        ]
      },
      {
        title: '二、禁止改动的内容',
        items: [
          '亲密关系、主页留言板、昵称、原好友、蛋圈 <span class="price-tag">¥1</span>',
          '更改主页生日日期 <span class="price-tag">¥5</span>',
          '禁止删除原好友、相册图片、他人的主页留言 <span class="price-tag">¥3</span>',
          '头像可改，但下线后须复原 <span class="price-tag">¥0.5</span>',
          '方案1的装扮搭配不能动，其他搭配方案可改 <span class="price-tag">¥0.5</span>'
        ]
      },
      {
        title: '三、行为规范',
        items: [
          '不恶意：提前退出、恶意挂机、骂人、找事、卡bug、刷屏。若被扣除蛋誉分或被禁言则：<span class="price-tag">¥1～¥15，视严重情况而定</span>',
          '对亲密值较高的好友，只能声明自己不是号主；对亲密值较低或自己加的好友，可称自己是号主。'
        ]
      },
      {
        title: '四、每日/每赛季任务',
        items: [
          '每日：领取呦呦彩虹币 <span class="price-tag">¥0.5</span>',
          '每周1～5：每次下线前领取活动奖励 <span class="price-tag">¥0.5</span>',
          '每周六日：疯狂星期六任务 <span class="price-tag">¥1</span>',
          '每赛季：<span class="price-tag">结束前上凤凰</span> 或 <span class="price-tag">超燃上传奇</span>',
          '未完成赛季任务则取消共号',
          '多次未达到要求则撤销共号资格'
        ]
      }
    ];

    function renderRules(containerId, rulesData) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = '';
      rulesData.forEach((block) => {
        const blockDiv = document.createElement('div');
        blockDiv.className = 'rule-block';
        const h3 = document.createElement('h3');
        h3.innerHTML = `<span class="emoji-bullet">${block.title.includes('安全') ? '🔒' : block.title.includes('禁止') ? '🚫' : block.title.includes('行为') ? '🤝' : '🎯'}</span>${block.title}`;
        blockDiv.appendChild(h3);
        const ul = document.createElement('ul');
        block.items.forEach(itemText => {
          const li = document.createElement('li');
          li.innerHTML = itemText;
          ul.appendChild(li);
        });
        blockDiv.appendChild(ul);
        container.appendChild(blockDiv);
      });
    }

    renderRules('rulesContainer1', account1Rules);
    renderRules('rulesContainer2', account2Rules);

    let timeOffset = 0;
    let networkSuccess = false;
    let clockInterval = null;
    const TIMEOUT_MS = 4000;
    const RETRY_INTERVAL_MS = 3000;

    function applyTimeAndShow() {
      ['skeleton1', 'skeleton2'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.opacity = '0';
      });
      ['clockError1', 'clockError2'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.remove('visible');
      });
      ['clockDisplay1', 'clockDisplay2'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.add('visible');
      });
      updateClocks();
      if (!clockInterval) {
        clockInterval = setInterval(updateClocks, 1000);
      }
    }

    function showTimeoutError() {
      ['skeleton1', 'skeleton2'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.opacity = '0';
      });
      ['clockError1', 'clockError2'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.add('visible');
      });
      ['clockDisplay1', 'clockDisplay2'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.remove('visible');
      });
    }

    function updateClocks() {
      if (!networkSuccess) return;
      const now = new Date(Date.now() + timeOffset);
      const y = now.getFullYear();
      const mo = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      const h = String(now.getHours()).padStart(2, '0');
      const mi = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      const dateStr = `${y}-${mo}-${d}`;
      const timeStr = `${h}:${mi}:${s}`;

      const d1 = document.getElementById('clockDate1');
      const t1 = document.getElementById('clockTime1');
      const d2 = document.getElementById('clockDate2');
      const t2 = document.getElementById('clockTime2');
      if (d1) d1.textContent = dateStr;
      if (t1) t1.textContent = timeStr;
      if (d2) d2.textContent = dateStr;
      if (t2) t2.textContent = timeStr;
    }

    async function tryFetchTime() {
      const sources = [
        async () => {
          const r = await fetch('https://timeapi.io/api/Time/current/zone?timeZone=Asia/Shanghai', {
            signal: AbortSignal.timeout(3500)
          });
          if (!r.ok) throw new Error('timeapi fail');
          const d = await r.json();
          return new Date(d.year, d.month - 1, d.day, d.hour, d.minute, d.seconds).getTime();
        },
        async () => {
          const r = await fetch('https://api.m.taobao.com/rest/api3.do?api=mtop.common.getTimestamp', {
            signal: AbortSignal.timeout(3500)
          });
          if (!r.ok) throw new Error('taobao fail');
          const d = await r.json();
          return parseInt(d.data.t, 10);
        },
        async () => {
          const r = await fetch('https://worldtimeapi.org/api/timezone/Asia/Shanghai', {
            signal: AbortSignal.timeout(3500)
          });
          if (!r.ok) throw new Error('wtapi fail');
          const d = await r.json();
          return new Date(d.datetime).getTime();
        }
      ];

      for (const fn of sources) {
        try {
          const t = await fn();
          if (!isNaN(t) && t > 0) return t;
        } catch (e) {}
      }
      return null;
    }

    async function fetchTimeLoop() {
      const timeoutTimer = setTimeout(() => {
        if (!networkSuccess) {
          showTimeoutError();
        }
      }, TIMEOUT_MS);

      while (!networkSuccess) {
        const t = await tryFetchTime();
        if (t !== null) {
          timeOffset = t - Date.now();
          networkSuccess = true;
          clearTimeout(timeoutTimer);
          applyTimeAndShow();
          return;
        }
        await new Promise(r => setTimeout(r, RETRY_INTERVAL_MS));
      }
    }

    fetchTimeLoop();

    const homePage = document.getElementById('homePage');
    const rulePage1 = document.getElementById('rulePage1');
    const rulePage2 = document.getElementById('rulePage2');

    function showHome() {
      homePage.classList.remove('hidden');
      rulePage1.classList.add('hidden');
      rulePage2.classList.add('hidden');
    }

    function showRulePage(accountId) {
      homePage.classList.add('hidden');
      if (accountId === '1') {
        rulePage1.classList.remove('hidden');
        rulePage2.classList.add('hidden');
        resetAnimations('rulesContainer1');
      } else if (accountId === '2') {
        rulePage2.classList.remove('hidden');
        rulePage1.classList.add('hidden');
        resetAnimations('rulesContainer2');
      }
      if (networkSuccess) updateClocks();
    }

    function resetAnimations(containerId) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.querySelectorAll('.rule-block').forEach(block => {
        block.style.animation = 'none';
        void block.offsetHeight;
        block.style.animation = '';
      });
    }

    document.getElementById('btnAccount1').addEventListener('click', () => showRulePage('1'));
    document.getElementById('btnAccount2').addEventListener('click', () => showRulePage('2'));
    document.querySelectorAll('.back-btn').forEach(btn => btn.addEventListener('click', showHome));

    // ---------- 联系我弹窗 ----------
    const contactBtn = document.getElementById('contactBtn');
    const contactModal = document.getElementById('contactModal');
    const contactClose = document.getElementById('contactClose');

    contactBtn.addEventListener('click', () => {
      contactModal.classList.add('open');
    });

    contactClose.addEventListener('click', () => {
      contactModal.classList.remove('open');
    });

    contactModal.addEventListener('click', (e) => {
      if (e.target === contactModal) {
        contactModal.classList.remove('open');
      }
    });

    showHome();
  })();
</script>
