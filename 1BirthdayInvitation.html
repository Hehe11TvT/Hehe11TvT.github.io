<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生日邀请函</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(circle at 30% 20%, #1a1a2e 0%, #0f0f1a 60%, #05050a 100%);
    color: #eaeaea;
    overflow-x: hidden;
    padding: 24px;
  }

  body::before {
    content: "";
    position: fixed;
    width: 600px; height: 600px;
    top: -200px; left: -150px;
    background: radial-gradient(circle, rgba(0,229,255,0.18), transparent 70%);
    filter: blur(40px);
    animation: float1 12s ease-in-out infinite alternate;
    pointer-events: none;
  }
  body::after {
    content: "";
    position: fixed;
    width: 500px; height: 500px;
    bottom: -180px; right: -120px;
    background: radial-gradient(circle, rgba(255,0,128,0.15), transparent 70%);
    filter: blur(50px);
    animation: float2 14s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes float1 { to { transform: translate(80px, 60px); } }
  @keyframes float2 { to { transform: translate(-70px, -50px); } }

  .card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 460px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 24px;
    padding: 40px 28px 32px;
    backdrop-filter: blur(18px);
    box-shadow: 0 0 40px rgba(0,229,255,0.08), 0 20px 60px rgba(0,0,0,0.6);
    text-align: center;
    animation: cardIn 0.9s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.97); }
    to   { opacity: 1; transform: none; }
  }

  .tag {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 3px;
    color: #00e5ff;
    border: 1px solid rgba(0,229,255,0.4);
    border-radius: 999px;
    padding: 5px 14px;
    margin-bottom: 22px;
    text-transform: uppercase;
  }

  h1 {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #00e5ff, #b388ff, #ff4081);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 10px;
  }

  .sub {
    font-size: 14px;
    color: #9a9ab0;
    letter-spacing: 1px;
    margin-bottom: 30px;
  }

  .info {
    text-align: left;
    background: rgba(255,255,255,0.03);
    border-left: 3px solid #00e5ff;
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .info .label {
    font-size: 11px;
    color: #00e5ff;
    letter-spacing: 2px;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .info .value {
    font-size: 16px;
    color: #f0f0f5;
    line-height: 1.6;
  }
  .info .value .dim {
    color: #8a8aa0;
    font-size: 13px;
  }

  .btns { margin-top: 26px; display: flex; flex-direction: column; gap: 12px; }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1px;
    padding: 14px 20px;
    border-radius: 14px;
    border: 1px solid rgba(0,229,255,0.35);
    color: #00e5ff;
    background: rgba(0,229,255,0.06);
    transition: all 0.25s ease;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover {
    background: rgba(0,229,255,0.16);
    box-shadow: 0 0 22px rgba(0,229,255,0.35);
    transform: translateY(-2px);
  }
  .btn.primary {
    border-color: transparent;
    color: #0f0f1a;
    background: linear-gradient(90deg, #00e5ff, #b388ff);
  }
  .btn.primary:hover {
    box-shadow: 0 0 28px rgba(179,136,255,0.55);
  }
  .btn:active { transform: scale(0.98); }

  .placeholder-hint {
    font-size: 11px;
    color: #666680;
    margin-top: 4px;
    letter-spacing: 0.5px;
  }

  .music-btn {
    position: fixed;
    top: 20px; right: 20px;
    z-index: 10;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(10px);
    color: #eaeaea;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s;
  }
  .music-btn:hover { background: rgba(0,229,255,0.18); }
  .music-btn.playing { color: #00e5ff; box-shadow: 0 0 18px rgba(0,229,255,0.5); }

  .footer {
    margin-top: 26px;
    font-size: 12px;
    color: #5a5a72;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

  <button class="music-btn" id="musicBtn" title="播放/暂停背景音乐">♪</button>
  <audio id="bgm" loop preload="auto">
    <source src="https://gh-proxy.com/https://raw.githubusercontent.com/Hehe11TvT/Hehe11TvT.github.io/main/Music/4.mp3" type="audio/mpeg">
  </audio>

  <div class="card">
    <div class="tag">Birthday Invitation</div>
    <h1>生日邀请函</h1>
    <p class="sub">诚邀你，来一起玩</p>

    <div class="info">
      <div class="label">时间</div>
      <div class="value">
        2026年12月26日 周六 上午 10:00
        <div class="dim">（我的生日是 12月25日 周五，聚会定在周六）</div>
      </div>
    </div>

    <div class="info">
      <div class="label">地点</div>
      <div class="value">
        待定
        <div class="dim">确定后我会更新</div>
      </div>
    </div>

    <div class="btns">
      <a class="btn primary" id="routeBtn" href="javascript:void(0)">
        🧭 一键导航
      </a>
      <a class="btn" id="poiBtn" href="javascript:void(0)">
        📍 查看地点详情
      </a>
    </div>

    <div class="footer">期待你来 ✦ 记得回我消息</div>
  </div>

<script>
  const PLACE = {
    location: "116.397,39.908",
    name: "待定地点"
  };

  const [lng, lat] = PLACE.location.split(",");
  const encodedName = encodeURIComponent(PLACE.name);

  const appRoute =
    "amapuri://route/plan/?sourceApplication=birthday" +
    "&dlat=" + lat + "&dlon=" + lng + "&dname=" + encodedName +
    "&dev=0&t=0";

  const appPoi =
    "amapuri://poi/detail?sourceApplication=birthday" +
    "&poiname=" + encodedName + "&lat=" + lat + "&lon=" + lng;

  const webRoute =
    "https://uri.amap.com/navigation?" +
    "to=" + encodeURIComponent(PLACE.location) + "," + encodedName +
    "&mode=car&policy=1&src=mypage&coordinate=gaode&callnative=1";

  const webPoi =
    "https://uri.amap.com/marker?" +
    "position=" + encodeURIComponent(PLACE.location) +
    "&name=" + encodedName +
    "&src=mypage&coordinate=gaode&callnative=1";

  function openMap(appUrl, webUrl) {
    let leftPage = false;

    const onLeave = () => { leftPage = true; };
    document.addEventListener("visibilitychange", onLeave);
    window.addEventListener("pagehide", onLeave);
    window.addEventListener("blur", onLeave);

    window.location.href = appUrl;

    setTimeout(() => {
      document.removeEventListener("visibilitychange", onLeave);
      window.removeEventListener("pagehide", onLeave);
      window.removeEventListener("blur", onLeave);

      if (!leftPage && !document.hidden) {
        window.location.href = webUrl;
      }
    }, 1500);
  }

  document.getElementById("routeBtn").addEventListener("click", () => {
    openMap(appRoute, webRoute);
  });

  document.getElementById("poiBtn").addEventListener("click", () => {
    openMap(appPoi, webPoi);
  });

  const musicBtn = document.getElementById("musicBtn");
  const bgm = document.getElementById("bgm");

  function setPlayingUI(isPlaying) {
    musicBtn.classList.toggle("playing", isPlaying);
    musicBtn.textContent = isPlaying ? "♫" : "♪";
  }

  function tryAutoPlay() {
    bgm.volume = 0.5;
    const p = bgm.play();
    if (p !== undefined) {
      p.then(() => setPlayingUI(true)).catch(() => {
        setPlayingUI(false);
        const resume = () => {
          bgm.play().then(() => setPlayingUI(true)).catch(() => {});
          document.removeEventListener("click", resume);
          document.removeEventListener("touchstart", resume);
        };
        document.addEventListener("click", resume, { once: true });
        document.addEventListener("touchstart", resume, { once: true });
      });
    }
  }

  window.addEventListener("load", tryAutoPlay);
  document.addEventListener("DOMContentLoaded", tryAutoPlay);

  musicBtn.addEventListener("click", () => {
    if (bgm.paused) {
      bgm.play().then(() => setPlayingUI(true)).catch(() => {
        alert("音乐加载失败，请检查镜像链接是否可用");
      });
    } else {
      bgm.pause();
      setPlayingUI(false);
    }
  });
</script>
</body>
</html>
