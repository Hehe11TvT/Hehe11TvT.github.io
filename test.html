<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>计数器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
    }
    .card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 48px 64px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .count {
      font-size: 96px;
      font-weight: 700;
      margin: 24px 0;
      text-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .btn {
      background: #fff;
      color: #764ba2;
      border: none;
      padding: 16px 48px;
      font-size: 24px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .btn:hover { transform: scale(1.05); }
    .btn:active { transform: scale(0.98); }
    .hint {
      margin-top: 16px;
      font-size: 14px;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>点击计数 +1</h1>
    <div class="count" id="countDisplay">0</div>
    <button class="btn" id="counterBtn">+1</button>
    <p class="hint">多设备自动同步，每 2 秒刷新</p>
  </div>

  <script>
    const display = document.getElementById('countDisplay');
    const btn = document.getElementById('counterBtn');

    async function fetchCount() {
      const res = await fetch('/api/count');
      const data = await res.json();
      display.textContent = data.count;
    }

    async function increment() {
      const current = parseInt(display.textContent);
      const res = await fetch('/api/count', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ value: current + 1 })
      });
      const data = await res.json();
      display.textContent = data.count;
    }

    btn.addEventListener('click', increment);
    fetchCount();
    setInterval(fetchCount, 2000);
  </script>
</body>
</html>
