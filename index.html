<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hehe11的人机验证</title>
<style>
*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: system-ui, sans-serif;
}
body{
  background: #f5f5f5;
  padding: 40px 20px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
}
/* 验证卡片 居中+四周留空 */
.verify-card{
  width: 420px;
  background: #fff;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  transition: all 0.2s;
}
/* 顶部蓝色提示栏 */
.tip-bar{
  background: #1677ff;
  color: #fff;
  padding: 20px;
}
.tip-bar h2{
  font-size: 18px;
  font-weight: normal;
}
.tip-bar .big-text{
  font-size: 42px;
  font-weight: bold;
  line-height: 1.2;
  margin: 4px 0;
}
.tip-bar p{
  font-size: 14px;
  opacity: 0.9;
}
/* 图片网格容器 */
.grid-wrap{
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 2px;
  background: #ccc;
  padding: 2px;
  margin: 10px;
}
.grid-item{
  aspect-ratio: 1 / 1;
  overflow: hidden;
  position: relative;
  cursor: pointer;
  transition: transform 0.25s ease;
}
.grid-item img{
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
/* 选中：缩小到85% + 边框遮罩 */
.grid-item.active{
  transform: scale(0.85);
}
.grid-item.active::after{
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(22, 119, 255, 0.35);
  border: 3px solid #1677ff;
}
/* 底部按钮区 */
.bottom-bar{
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
}
.left-ctrl{
  display: flex;
  gap: 24px;
}
.left-ctrl svg{
  width: 28px;
  height: 28px;
  fill: #666;
  cursor: pointer;
  transition: fill 0.2s, transform 0.1s;
}
.left-ctrl svg:active{
  transform: scale(0.95);
}
/* 耳机按钮悬浮效果 */
.left-ctrl svg:nth-child(2):hover {
  fill: #1677ff;
}
/* 刷新按钮悬浮效果 */
.left-ctrl svg:first-child:hover {
  fill: #00aa55;
}
.action-btn{
  background: #1677ff;
  color: #fff;
  border: none;
  font-size: 16px;
  padding: 10px 28px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s;
}
.action-btn:active{
  opacity: 0.85;
}
/* 结果页面样式 */
.result-page{
  display: none;
  padding: 60px 20px;
  text-align: center;
}
.result-page h2{
  font-size: 24px;
  margin-bottom: 30px;
}
.back-btn{
  margin-top: 20px;
  background: #999;
}
.success{
  color: #00aa55;
}
.fail{
  color: #ff4444;
}
/* 进入系统按钮样式 */
.enter-btn{
  margin-top: 15px;
  background: #00aa55;
}
/* ===== 原有按钮loading动画样式（主按钮） ===== */
.action-btn.loading {
  pointer-events: none;
  opacity: 0.7;
  position: relative;
  color: transparent !important;
}
.action-btn.loading::after {
  content: '';
  position: absolute;
  width: 18px;
  height: 18px;
  top: 50%;
  left: 50%;
  margin-left: -9px;
  margin-top: -9px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: btn-spin 0.8s linear infinite;
}
@keyframes btn-spin {
  to { transform: rotate(360deg); }
}

/* ===== 盲人模式提交按钮专属loading样式 ===== */
.blind-submit.loading {
  pointer-events: none;
  opacity: 0.7;
  position: relative;
  color: transparent !important;
}
.blind-submit.loading::after {
  content: '';
  position: absolute;
  width: 18px;
  height: 18px;
  top: 50%;
  left: 50%;
  margin-left: -9px;
  margin-top: -9px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: btn-spin 0.8s linear infinite;
}

/* ===== 修复：成功页面按钮垂直排列 + 统一宽度 ===== */
.success-btn-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.success-btn-wrapper .action-btn {
  width: 160px;
  margin-top: 0;
  text-align: center;
  display: inline-block;
}
/* ===== 修复结束 ===== */

/* ========== 盲人模式弹窗 (第二小窗口) 样式 ========== */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.5);
  justify-content: center;
  align-items: center;
  z-index: 2000;
  backdrop-filter: blur(2px);
}
.blind-box {
  width: 340px;
  background: #fff;
  border-radius: 28px;
  box-shadow: 0 20px 35px rgba(0,0,0,0.2);
  overflow: hidden;
  animation: fadeSlideUp 0.2s ease;
}
@keyframes fadeSlideUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.blind-header {
  background: #1e293b;
  color: white;
  padding: 18px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.blind-header h3 {
  font-size: 18px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 8px;
}
.blind-header h3 svg {
  width: 22px;
  height: 22px;
  fill: white;
}
.close-modal {
  background: none;
  border: none;
  color: white;
  font-size: 26px;
  cursor: pointer;
  line-height: 1;
  padding: 0 6px;
  opacity: 0.8;
  transition: 0.2s;
}
.close-modal:hover {
  opacity: 1;
}
.blind-body {
  padding: 24px 22px;
  background: #fef9e6;
}
.audio-area {
  background: #ffffff;
  border-radius: 40px;
  padding: 12px 16px;
  margin-bottom: 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  border: 1px solid #ffd966;
}
.audio-label {
  font-weight: 600;
  color: #b45309;
  font-size: 15px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.play-audio-btn {
  background: #1677ff;
  border: none;
  color: white;
  padding: 8px 18px;
  border-radius: 40px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: 0.2s;
}
.play-audio-btn:active {
  transform: scale(0.96);
}
.input-group {
  margin-bottom: 28px;
}
.input-group label {
  display: block;
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 8px;
  color: #374151;
}
.input-group input {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid #d1d5db;
  border-radius: 36px;
  font-size: 15px;
  outline: none;
  transition: 0.2s;
  background: white;
}
.input-group input:focus {
  border-color: #1677ff;
  box-shadow: 0 0 0 3px rgba(22,119,255,0.2);
}
.blind-submit {
  width: 100%;
  background: #00aa55;
  padding: 12px;
  border-radius: 40px;
  font-size: 16px;
  font-weight: bold;
  border: none;
  color: white;
  cursor: pointer;
  transition: 0.2s;
}
.blind-submit:active {
  transform: scale(0.97);
  background: #008844;
}
.error-msg {
  color: #dc2626;
  font-size: 13px;
  margin-top: 12px;
  text-align: center;
  min-height: 32px;
}
/* ========== 盲人模式结束 ========== */
</style>
</head>
<body>

<!-- 主验证卡片 -->
<div class="verify-card" id="verifyPage">
  <div class="tip-bar">
    <h2>请选择包含</h2>
    <div class="big-text">石胜军</div>
    <p>的所有图块</p>
    <p>如果没有，请点击“跳过”。</p>
  </div>

  <!-- 4x4分块图片 -->
  <div class="grid-wrap" id="gridBox">
    <div class="grid-item" data-row="1" data-col="1"><img src="https://musichehe121.oss-cn-chengdu.aliyuncs.com/picture/retouch_2026061112103639.jpg"></div>
    <div class="grid-item" data-row="1" data-col="2"><img src="https://musichehe121.oss-cn-chengdu.aliyuncs.com/picture/retouch_2.jpg"></div>
    <div class="grid-item" data-row="1" data-col="3"><img src="https://musichehe121.oss-cn-chengdu.aliyuncs.com/picture/retouch_3.jpg"></div>
    <div class="grid-item" data-row="1" data-col="4"><img src="https://musichehe121.oss-cn-chengdu.aliyuncs.com/picture/retouch_4.jpg"></div>

    <div class="grid-item" data-row="2" data-col="1"><img src="https://musichehe121.oss-cn-chengdu.aliyuncs.com/picture/retouch_5.jpg"></div>
    <div class="grid-item" data-row="2" data-col="2"><img src="https://musichehe121.oss-cn-chengdu.aliyuncs.com/picture/retouch_6.jpg"></div>
    <div class="grid-item" data-row="2" data-col="3"><img src="https://musichehe121.oss-cn-chengdu.aliyuncs.com/picture/retouch_7.jpg"></div>
    <div class="grid-item" data-row="2" data-col="4"><img src="https://musichehe121.oss-cn-chengdu.aliyuncs.com/picture/retouch_8.jpg"></div>

    <div class="grid-item" data-row="3" data-col="1"><img src="https://musichehe121.oss-cn-chengdu.aliyuncs.com/picture/retouch_9.jpg"></div>
    <div class="grid-item" data-row="3" data-col="2"><img src="https://musichehe121.oss-cn-chengdu.aliyuncs.com/picture/retouch_10.jpg"></div>
    <div class="grid-item" data-row="3" data-col="3"><img src="https://musichehe121.oss-cn-chengdu.aliyuncs.com/picture/retouch_11.jpg"></div>
    <div class="grid-item" data-row="3" data-col="4"><img src="https://musichehe121.oss-cn-chengdu.aliyuncs.com/picture/retouch_12.jpg"></div>

    <div class="grid-item" data-row="4" data-col="1"><img src="https://musichehe121.oss-cn-chengdu.aliyuncs.com/picture/retouch_13.jpg"></div>
    <div class="grid-item" data-row="4" data-col="2"><img src="https://musichehe121.oss-cn-chengdu.aliyuncs.com/picture/retouch_14.jpg"></div>
    <div class="grid-item" data-row="4" data-col="3"><img src="https://musichehe121.oss-cn-chengdu.aliyuncs.com/picture/retouch_15.jpg"></div>
    <div class="grid-item" data-row="4" data-col="4"><img src="https://musichehe121.oss-cn-chengdu.aliyuncs.com/picture/retouch_16.jpg"></div>
  </div>

  <div class="bottom-bar">
    <div class="left-ctrl">
      <!-- 最左边：刷新按钮（弯曲箭头），功能：重置所有图片选中状态 -->
      <svg viewBox="0 0 24 24" id="refreshBtn">
        <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
      </svg>
      <!-- 中间的耳机图标（原无功能），现在点击打开盲人模式弹窗 -->
      <svg viewBox="0 0 24 24" id="headphoneBtn" style="fill:#666;">
        <path d="M12 2c-4.97 0-9 4.03-9 9v7c0 1.66 1.34 3 3 3h3v-8H5v-2c0-3.87 3.13-7 7-7s7 3.13 7 7v2h-4v8h3c1.66 0 3-1.34 3-3v-7c0-4.97-4.03-9-9-9z"/>
      </svg>
      <!-- 最右边：信息/帮助图标（保持原样） -->
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
      </svg>
    </div>
    <button class="action-btn" id="mainBtn">跳过</button>
  </div>
</div>

<!-- 成功结果页 -->
<div class="verify-card result-page" id="successPage">
  <h2 class="success">✅ 你已完成人机认证</h2>
  <div class="success-btn-wrapper">
    <a href="https://hehe11tvt.github.io/phone.html" style="text-decoration: none;"><button class="action-btn enter-btn">进入系统</button></a>
    <button class="action-btn back-btn" id="backFromSuccess">返回上一页</button>
  </div>
</div>

<!-- 失败结果页 -->
<div class="verify-card result-page" id="failPage">
  <h2 class="fail">❌ 检测到你是人机<br>请重新验证<br>若无法完成图形验证<br>请使用无障碍验证</h2>
  <button class="action-btn back-btn" id="backFromFail">返回上一页</button>
</div>

<!-- 盲人模式弹窗 (第二小窗口) -->
<div id="blindModal" class="modal-overlay">
  <div class="blind-box">
    <div class="blind-header">
      <h3>
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path d="M12 2c-4.97 0-9 4.03-9 9v7c0 1.66 1.34 3 3 3h3v-8H5v-2c0-3.87 3.13-7 7-7s7 3.13 7 7v2h-4v8h3c1.66 0 3-1.34 3-3v-7c0-4.97-4.03-9-9-9z" fill="white"/>
        </svg>
        盲人模式 · 语音验证
      </h3>
      <button class="close-modal" id="closeModalBtn">&times;</button>
    </div>
    <div class="blind-body">
      <div class="audio-area">
        <span class="audio-label">音频验证</span>
        <button class="play-audio-btn" id="playAudioBtn">播放音频</button>
      </div>
      <div class="input-group">
        <label>请输入听到的内容</label>
        <input type="text" id="audioCodeInput" placeholder="请输入音频中的验证码" autocomplete="off">
      </div>
      <button class="blind-submit" id="submitBlindBtn">提交验证</button>
      <div id="blindErrorMsg" class="error-msg"></div>
    </div>
  </div>
</div>

<script>
// --------------------- 原验证逻辑完全保留 -------------------------
const gridBox = document.getElementById('gridBox')
const items = gridBox.querySelectorAll('.grid-item')
const mainBtn = document.getElementById('mainBtn')
const verifyPage = document.getElementById('verifyPage')
const successPage = document.getElementById('successPage')
const failPage = document.getElementById('failPage')
const backFromSuccess = document.getElementById('backFromSuccess')
const backFromFail = document.getElementById('backFromFail')

// 已取消 (1,3)，正确图块如下
const correctSet = new Set([
  "2,3",
  "2,4",
  "3,2",
  "3,3",
  "3,4",
  "4,2",
  "4,3"
])

// 切换选中 + 更新按钮文字
items.forEach(item=>{
  item.addEventListener('click',()=>{
    item.classList.toggle('active')
    updateBtnText()
  })
})

function updateBtnText(){
  const hasSelected = Array.from(items).some(i=>i.classList.contains('active'))
  mainBtn.textContent = hasSelected ? '下一步' : '跳过'
}

function resetSelect(){
  items.forEach(i=>i.classList.remove('active'))
  updateBtnText()
}

// 【最左边刷新按钮】绑定重置选中功能
const refreshBtn = document.getElementById('refreshBtn')
if(refreshBtn) {
  refreshBtn.addEventListener('click', resetSelect)
}

function checkSelection(){
  const selected = Array.from(items)
    .filter(i=>i.classList.contains('active'))
    .map(i=>`${i.dataset.row},${i.dataset.col}`)
  const selectedSet = new Set(selected)
  if(selectedSet.size !== correctSet.size) return false
  for(const key of correctSet){
    if(!selectedSet.has(key)) return false
  }
  return true
}

let isProcessing = false;
mainBtn.addEventListener('click', async () => {
  if (isProcessing) return;
  isProcessing = true;
  mainBtn.classList.add('loading');
  await new Promise(resolve => setTimeout(resolve, 1000));
  mainBtn.classList.remove('loading');
  
  const hasSelected = Array.from(items).some(i=>i.classList.contains('active'))
  if(hasSelected){
    if(checkSelection()){
      verifyPage.style.display = 'none'
      successPage.style.display = 'block'
    }else{
      verifyPage.style.display = 'none'
      failPage.style.display = 'block'
    }
  }else{
    verifyPage.style.display = 'none'
    failPage.style.display = 'block'
  }
  isProcessing = false;
})

backFromSuccess.addEventListener('click',()=>{
  successPage.style.display = 'none'
  verifyPage.style.display = 'block'
  resetSelect()
})
backFromFail.addEventListener('click',()=>{
  failPage.style.display = 'none'
  verifyPage.style.display = 'block'
  resetSelect()
})

// ===================== 盲人模式（耳机按钮 + 音频播放 + 验证判定）=====================
// 已按最新要求：将音频直链替换为 https://musichehe121.oss-cn-chengdu.aliyuncs.com/Music/yanzhengma.mp3
// 其他要求：点提交验证时按钮转圈2秒再判断，播放音频每次停止上一次播放（防重音）

const headphoneBtn = document.getElementById('headphoneBtn');
const blindModal = document.getElementById('blindModal');
const closeModalBtn = document.getElementById('closeModalBtn');
const playAudioBtn = document.getElementById('playAudioBtn');
const submitBlindBtn = document.getElementById('submitBlindBtn');
const audioCodeInput = document.getElementById('audioCodeInput');
const blindErrorMsg = document.getElementById('blindErrorMsg');

let currentAudio = null;          // 当前播放的音频实例

// 【已替换】新的音频直链 (用户提供)
const BLIND_AUDIO_URL = 'https://musichehe121.oss-cn-chengdu.aliyuncs.com/Music/yanzhengma.mp3';

/**
 * 播放音频（每次调用会先停止上一次播放的音频，防止重叠）
 * 增强错误处理，确保用户能感知播放状态
 */
function playAudioCheck() {
  // 如果已有正在播放的音频，先停止并销毁引用
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
  }
  
  // 创建新音频实例
  const audio = new Audio(BLIND_AUDIO_URL);
  currentAudio = audio;
  
  // 播放并处理异常（浏览器可能因为策略阻止自动播放，但这里由用户点击触发，一般可播）
  audio.play().catch(error => {
    console.error('音频播放失败:', error);
    blindErrorMsg.innerText = '播放失败，请检查网络或点击重试';
    setTimeout(() => {
      if (blindErrorMsg.innerText === '播放失败，请检查网络或点击重试') {
        blindErrorMsg.innerText = '';
      }
    }, 2000);
    // 播放失败后清空当前音频引用
    if (currentAudio === audio) currentAudio = null;
  });
  
  // 播放结束时清理引用
  audio.onended = () => {
    if (currentAudio === audio) {
      currentAudio = null;
    }
  };
  
  // 播放错误时清理
  audio.onerror = () => {
    if (currentAudio === audio) {
      currentAudio = null;
    }
    // 不重复显示错误，避免覆盖已有提示
    if (!blindErrorMsg.innerText) {
      blindErrorMsg.innerText = '音频加载出错，请稍后重试';
      setTimeout(() => {
        if (blindErrorMsg.innerText === '音频加载出错，请稍后重试') blindErrorMsg.innerText = '';
      }, 2000);
    }
  };
}

// 耳机按钮：打开盲人模式弹窗，并清空之前的状态以及任何残留错误/音频
if(headphoneBtn) {
  headphoneBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    // 重置输入和错误提示
    audioCodeInput.value = '';
    blindErrorMsg.innerText = '';
    // 如果有正在播放的音频，停止播放
    if (currentAudio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
      currentAudio = null;
    }
    blindModal.style.display = 'flex';
  });
}

// 关闭弹窗（同时停止播放音频）
function closeModal() {
  blindModal.style.display = 'none';
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
  }
}
closeModalBtn.addEventListener('click', closeModal);
blindModal.addEventListener('click', (e) => {
  if (e.target === blindModal) closeModal();
});

// 播放音频按钮：每次点击都停止上一次音频并重新播放新音频
playAudioBtn.addEventListener('click', (e) => {
  e.preventDefault();
  playAudioCheck();
});

// 【核心优化】提交验证按钮：显示两秒转圈动画，再进行判断（完全符合需求）
let isBlindSubmitting = false;  // 防止重复点击
submitBlindBtn.addEventListener('click', async (e) => {
  e.preventDefault();
  // 防止在动画/验证过程中重复提交
  if (isBlindSubmitting) return;
  
  const userInput = audioCodeInput.value.trim();
  if (!userInput) {
    blindErrorMsg.innerText = '请输入听到的内容';
    return;
  }
  
  // 锁定按钮，开启loading动画
  isBlindSubmitting = true;
  submitBlindBtn.classList.add('loading');
  // 按钮文字变为透明（loading伪类已隐藏原文字），并显示转圈圈
  
  // 等待2秒（转圈动画持续2秒后判断）
  await new Promise(resolve => setTimeout(resolve, 2000));
  
  // 移除loading动画
  submitBlindBtn.classList.remove('loading');
  let isValid = (userInput === '我要日死你的妈');
  if (isValid) {
    // 验证成功：关闭模态框，显示成功页面
    closeModal();  // 该方法内部会停止音频
    verifyPage.style.display = 'none';
    successPage.style.display = 'block';
  } else {
    // 验证失败：关闭模态框，显示失败页面
    closeModal();
    verifyPage.style.display = 'none';
    failPage.style.display = 'block';
  }
  
  // 解锁提交状态
  isBlindSubmitting = false;
});

// 按ESC关闭弹窗的同时停止音频
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && blindModal.style.display === 'flex') {
    closeModal();
  }
});

// 额外优化：弹窗打开时如果按回车提交支持（提升无障碍体验）
audioCodeInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter' && blindModal.style.display === 'flex' && !isBlindSubmitting) {
    e.preventDefault();
    submitBlindBtn.click();
  }
});
</script>
</body>
</html>
